<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07121b">
  <title>Pong | Writers Hub</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07121b;
      --panel: #10232d;
      --line: #203c48;
      --text: #f4f7fa;
      --muted: #9eafb9;
      --gold: #ffbf68;
      --teal: #65e0ca;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 0%, #173341 0, var(--bg) 58%);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { width: min(940px, 100%); }
    .heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.04em; }
    .eyebrow { color: var(--teal); font-size: .75rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .subtitle { margin: 5px 0 0; color: var(--muted); }
    .scoreboard { display: flex; align-items: center; justify-content: center; gap: clamp(20px, 8vw, 76px); padding: 12px; }
    .score { min-width: 90px; text-align: center; }
    .score strong { display: block; color: var(--gold); font-size: clamp(2rem, 8vw, 3.2rem); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .score span { color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .vs { color: #617680; font-size: .8rem; font-weight: 800; letter-spacing: .1em; }
    .court-wrap { padding: 10px; border: 1px solid var(--line); border-radius: 20px; background: #0b1b24; box-shadow: 0 24px 70px #0006; }
    canvas { display: block; width: 100%; height: auto; border-radius: 12px; background: #081820; touch-action: none; }
    .controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 16px 2px 0; }
    .hint { margin: 0; color: var(--muted); font-size: .9rem; }
    .buttons { display: flex; gap: 10px; }
    button { min-height: 42px; padding: 9px 16px; border: 1px solid #45616c; border-radius: 999px; background: transparent; color: var(--text); font: inherit; font-weight: 750; cursor: pointer; }
    button.primary { border-color: var(--gold); background: var(--gold); color: #15191d; }
    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
    #status { min-height: 1.5em; margin: 12px 0 0; color: var(--teal); text-align: center; font-weight: 700; }
    @media (max-width: 560px) {
      body { padding: 22px 12px; }
      .heading { align-items: start; flex-direction: column; }
      .court-wrap { padding: 6px; border-radius: 14px; }
      .controls { align-items: stretch; flex-direction: column; }
      .buttons button { flex: 1; }
      .hint { text-align: center; }
    }
  </style>
</head>
<body>
  <main>
    <header class="heading">
      <div>
        <div class="eyebrow">A classic arcade game</div>
        <h1>Pong</h1>
        <p class="subtitle">Play against the computer. First to 7 points wins.</p>
      </div>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score"><strong id="playerScore">0</strong><span>You</span></div>
      <span class="vs" aria-hidden="true">—</span>
      <div class="score"><strong id="computerScore">0</strong><span>Computer</span></div>
    </section>

    <div class="court-wrap">
      <canvas id="game" width="900" height="520" aria-label="Pong game. Move your paddle with your mouse or the up and down arrow keys."></canvas>
    </div>
    <p id="status" role="status" aria-live="polite">Press Start to play.</p>
    <div class="controls">
      <p class="hint">Move your mouse over the court or use <kbd>↑</kbd> / <kbd>↓</kbd> to control your paddle.</p>
      <div class="buttons">
        <button class="primary" id="startButton" type="button">Start game</button>
        <button id="resetButton" type="button">Reset score</button>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const playerScoreEl = document.getElementById('playerScore');
      const computerScoreEl = document.getElementById('computerScore');
      const statusEl = document.getElementById('status');
      const startButton = document.getElementById('startButton');
      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const PADDLE_WIDTH = 14;
      const PADDLE_HEIGHT = 96;
      const BALL_RADIUS = 9;
      const WINNING_SCORE = 7;
      const keys = new Set();
      const player = { x: 34, y: HEIGHT / 2 - PADDLE_HEIGHT / 2, score: 0 };
      const computer = { x: WIDTH - 34 - PADDLE_WIDTH, y: HEIGHT / 2 - PADDLE_HEIGHT / 2, score: 0 };
      const ball = { x: WIDTH / 2, y: HEIGHT / 2, vx: 5, vy: 2.5 };
      let running = false;
      let finished = false;
      let lastTime = 0;
      let animationId = 0;

      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

      function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = '#081820';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.setLineDash([10, 14]);
        ctx.strokeStyle = '#29434d';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(WIDTH / 2, 0);
        ctx.lineTo(WIDTH / 2, HEIGHT);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#65e0ca';
        ctx.beginPath();
        ctx.arc(WIDTH / 2, HEIGHT / 2, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffbf68';
        ctx.fillRect(player.x, player.y, PADDLE_WIDTH, PADDLE_HEIGHT);
        ctx.fillStyle = '#65e0ca';
        ctx.fillRect(computer.x, computer.y, PADDLE_WIDTH, PADDLE_HEIGHT);
        ctx.fillStyle = '#f4f7fa';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      }

      function resetBall(direction) {
        ball.x = WIDTH / 2;
        ball.y = HEIGHT / 2;
        ball.vx = 5 * direction;
        ball.vy = (Math.random() * 4 - 2) || 1.5;
      }

      function update(delta) {
        const step = Math.min(delta / 16.67, 2);
        const playerSpeed = 7 * step;
        if (keys.has('ArrowUp')) player.y -= playerSpeed;
        if (keys.has('ArrowDown')) player.y += playerSpeed;
        player.y = clamp(player.y, 0, HEIGHT - PADDLE_HEIGHT);

        // The computer tracks the ball, with a small reaction offset for a fair game.
        const target = ball.y - PADDLE_HEIGHT / 2;
        const aiSpeed = 4.2 * step;
        computer.y += clamp(target - computer.y, -aiSpeed, aiSpeed);
        computer.y = clamp(computer.y, 0, HEIGHT - PADDLE_HEIGHT);

        ball.x += ball.vx * step;
        ball.y += ball.vy * step;

        if (ball.y - BALL_RADIUS <= 0 || ball.y + BALL_RADIUS >= HEIGHT) {
          ball.y = clamp(ball.y, BALL_RADIUS, HEIGHT - BALL_RADIUS);
          ball.vy *= -1;
        }

        const overlapsY = (paddle) => ball.y + BALL_RADIUS >= paddle.y && ball.y - BALL_RADIUS <= paddle.y + PADDLE_HEIGHT;
        if (ball.vx < 0 && ball.x - BALL_RADIUS <= player.x + PADDLE_WIDTH && ball.x > player.x && overlapsY(player)) {
          ball.x = player.x + PADDLE_WIDTH + BALL_RADIUS;
          bounceFrom(player, 1);
        } else if (ball.vx > 0 && ball.x + BALL_RADIUS >= computer.x && ball.x < computer.x + PADDLE_WIDTH && overlapsY(computer)) {
          ball.x = computer.x - BALL_RADIUS;
          bounceFrom(computer, -1);
        }

        if (ball.x + BALL_RADIUS < 0) score(computer);
        if (ball.x - BALL_RADIUS > WIDTH) score(player);
      }

      function bounceFrom(paddle, direction) {
        const hit = (ball.y - (paddle.y + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.35, 10);
        const angle = hit * (Math.PI / 3);
        ball.vx = direction * speed * Math.cos(angle);
        ball.vy = speed * Math.sin(angle);
      }

      function score(winner) {
        winner.score += 1;
        playerScoreEl.textContent = player.score;
        computerScoreEl.textContent = computer.score;
        if (winner.score >= WINNING_SCORE) {
          finished = true;
          running = false;
          startButton.textContent = 'Play again';
          statusEl.textContent = winner === player ? 'You win! Great game.' : 'Computer wins this round. Try again!';
          return;
        }
        statusEl.textContent = winner === player ? 'Point for you!' : 'Point for the computer.';
        resetBall(winner === player ? 1 : -1);
      }

      function frame(time) {
        const delta = lastTime ? time - lastTime : 16.67;
        lastTime = time;
        if (running) update(delta);
        draw();
        if (running) animationId = requestAnimationFrame(frame);
      }

      function startGame() {
        if (finished) resetGame();
        if (running) return;
        running = true;
        statusEl.textContent = 'Game on!';
        startButton.textContent = 'Pause';
        lastTime = 0;
        cancelAnimationFrame(animationId);
        animationId = requestAnimationFrame(frame);
      }

      function resetGame() {
        running = false;
        finished = false;
        player.score = 0;
        computer.score = 0;
        player.y = computer.y = HEIGHT / 2 - PADDLE_HEIGHT / 2;
        playerScoreEl.textContent = '0';
        computerScoreEl.textContent = '0';
        resetBall(Math.random() < 0.5 ? -1 : 1);
        startButton.textContent = 'Start game';
        statusEl.textContent = 'Press Start to play.';
        cancelAnimationFrame(animationId);
        draw();
      }

      canvas.addEventListener('pointermove', (event) => {
        const rect = canvas.getBoundingClientRect();
        const scaleY = HEIGHT / rect.height;
        player.y = clamp((event.clientY - rect.top) * scaleY - PADDLE_HEIGHT / 2, 0, HEIGHT - PADDLE_HEIGHT);
        if (!running) draw();
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
          event.preventDefault();
          keys.add(event.key);
        }
        if (event.key === ' ' && !event.repeat) {
          event.preventDefault();
          running ? pauseGame() : startGame();
        }
      });
      window.addEventListener('keyup', (event) => keys.delete(event.key));
      window.addEventListener('blur', () => keys.clear());

      function pauseGame() {
        running = false;
        cancelAnimationFrame(animationId);
        startButton.textContent = 'Resume';
        statusEl.textContent = 'Paused.';
        draw();
      }

      startButton.addEventListener('click', () => running ? pauseGame() : startGame());
      document.getElementById('resetButton').addEventListener('click', resetGame);
      resetBall(1);
      draw();
    })();
  </script>
</body>
</html>
